# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: INO-A9 Local Bridge
version: "0.4.0"
slug: ino_a9_bridge
description: Local INO-A9 camera bridge with audio-capable RTSP streams
url: "https://github.com/IvanFogel/ino-a9-local-bridge/tree/main/ino_a9_bridge"
arch:
  - amd64
  - aarch64
init: false
startup: application
discovery:
  - ino_a9_bridge
options:
  log_level: info
  cameras: []
schema:
  log_level: "list(debug|info|warning|error)"
  cameras:
    - name: "match(^[A-Za-z0-9_-]+$)"
      host: "str(1,)"
      port: port
      bootstrap_prefix: password
      user: password
      lan_password: password
