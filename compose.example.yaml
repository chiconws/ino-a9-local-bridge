services:
  bridge:
    build: .
    image: local/ino-a9-local-bridge:0.3.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../config/camera.json:/run/wificam/camera.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
